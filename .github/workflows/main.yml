name: Bosch Stock Export Sync

on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC = 07:00 SAST, every day
  workflow_dispatch:        # lets you also trigger it manually from the Actions tab

jobs:
  fetch-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download Bosch Material Export
        run: |
          curl -sSL -f -o bosch_stock_export.csv \
            "https://extranet-emea.bosch-pt.com/cgi-bin/WebObjects.dll/V5Prod_CatalogWeb.woa/wa/Exchange/material?exchange=35npim6aefn7v99hq01f8sgm94&customer=9781000885"

      - name: Verify the download isn't empty/broken
        run: |
          if [ ! -s bosch_stock_export.csv ]; then
            echo "Download failed or returned an empty file"
            exit 1
          fi
          echo "First few lines:"
          head -5 bosch_stock_export.csv

      - name: Commit and push if the file changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bosch_stock_export.csv
          git diff --staged --quiet || git commit -m "Update Bosch stock export $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
